; Scalability levels used by the in-game Graphics setting (LOW / MEDIUM / HIGH / ULTRA
; = levels 0..3, applied with UGameUserSettings::SetOverallScalabilityLevel).
; Only the keys below change; everything else comes from the engine's BaseScalability.ini.
; LOW and MEDIUM are tuned for phones (fewer shadow cascades, lower view distance,
; less foliage, smaller texture pool) to cut GPU load, heat and battery use.

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.4
r.SkeletalMeshLODBias=2
r.StaticMeshLODDistanceScale=1.5

[ViewDistanceQuality@1]
r.ViewDistanceScale=0.6
r.SkeletalMeshLODBias=1
r.StaticMeshLODDistanceScale=1.25

[ViewDistanceQuality@2]
r.ViewDistanceScale=0.85
r.SkeletalMeshLODBias=0

[ShadowQuality@0]
r.ShadowQuality=0
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=512
r.Shadow.DistanceScale=0.4

[ShadowQuality@1]
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=1024
r.Shadow.DistanceScale=0.6

[FoliageQuality@0]
foliage.DensityScale=0.2
grass.DensityScale=0.2

[FoliageQuality@1]
foliage.DensityScale=0.45
grass.DensityScale=0.45

[FoliageQuality@2]
foliage.DensityScale=0.75
grass.DensityScale=0.75

[PostProcessQuality@0]
r.BloomQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.EyeAdaptationQuality=0
r.MotionBlurQuality=0

[PostProcessQuality@1]
r.BloomQuality=2
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.MotionBlurQuality=0

[TextureQuality@0]
r.Streaming.MipBias=2
r.MaxAnisotropy=0
r.Streaming.PoolSize=200

[TextureQuality@1]
r.Streaming.MipBias=1
r.MaxAnisotropy=2
r.Streaming.PoolSize=350

[EffectsQuality@0]
r.RefractionQuality=0
r.SSR.Quality=0
r.ParticleLightQuality=0

[EffectsQuality@1]
r.RefractionQuality=0
r.SSR.Quality=0
r.ParticleLightQuality=1
