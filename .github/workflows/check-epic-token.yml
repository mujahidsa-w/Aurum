name: Check EPIC token access

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify token can read UnrealEngine 4.26
        env:
          EPIC_TOKEN: ${{ secrets.EPIC_GITHUB_TOKEN }}
        run: |
          if [ -z "$EPIC_TOKEN" ]; then echo "EPIC_GITHUB_TOKEN secret is EMPTY or missing"; exit 1; fi
          echo "Secret is set (length ${#EPIC_TOKEN})"
          git ls-remote --heads "https://x-access-token:${EPIC_TOKEN}@github.com/EpicGames/UnrealEngine.git" 4.26 && echo "ACCESS OK"
