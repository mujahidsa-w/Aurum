
name: Aurum Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Checkout Aurum
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Restore assets
        run: |
          chmod +x AssetParts/restore.sh
          ./AssetParts/restore.sh
          rm -rf AssetParts
          df -h /

      - name: Checkout Unreal Engine
        uses: actions/checkout@v4
        with:
          repository: EpicGames/UnrealEngine
          ref: 4.26
          token: ${{ secrets.EPIC_GITHUB_TOKEN }}
          path: UE
          lfs: false

      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK
        shell: bash
        run: |
          set +e

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "ndk;21.1.6352462" \
            "platforms;android-29" \
            "build-tools;29.0.2" \
            < <(yes)

          SDK_STATUS=$?

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "SDK installation failed: $SDK_STATUS"
            exit "$SDK_STATUS"
          fi

          echo "NDKROOT=$ANDROID_HOME/ndk/21.1.6352462" >> "$GITHUB_ENV"
          echo "NDK_ROOT=$ANDROID_HOME/ndk/21.1.6352462" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"


      - name: Setup engine
        working-directory: UE
        run: |

          ./Setup.sh \
            --exclude=Win32 \
            --exclude=Win64 \
            --exclude=Mac \
            --exclude=IOS \
            --exclude=HoloLens \
            --exclude=Lumin

          ./GenerateProjectFiles.sh

      - name: Build editor + game module
        working-directory: UE
        run: |
          set -o pipefail

          ./Engine/Build/BatchFiles/Linux/Build.sh \
            ShaderCompileWorker Linux Development

          ./Engine/Build/BatchFiles/Linux/Build.sh \
            PUBG_BlueprintEditor Linux Development \
            -project="$GITHUB_WORKSPACE/PUBG_BP_Project/PUBG_Blueprint.uproject" \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Package APK
        working-directory: UE
        run: |
          set -o pipefail

          ./Engine/Build/BatchFiles/RunUAT.sh BuildCookRun \
            -project="$GITHUB_WORKSPACE/PUBG_BP_Project/PUBG_Blueprint.uproject" \
            -noP4 \
            -platform=Android \
            -cookflavor=ASTC \
            -clientconfig=Development \
            -build \
            -cook \
            -stage \
            -pak \
            -package \
            -archive \
            -archivedirectory="$GITHUB_WORKSPACE/out" \
            -unattended \
            -utf8output \
            2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurum-Android
          path: out/**/*.apk
          if-no-files-found: error

      - name: First errors
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            grep -E "error:|ERROR:" "$RUNNER_TEMP/build.log" | head -40 || true
          fi
