# Builds the game for iPhone with Unreal Engine 5 and produces an UNSIGNED .ipa
# (artifact "AurumMobile-iOS-<config>-unsigned"). Sign it later with your own
# Apple account. No Apple account, certificate or Mac is needed to run this.
#
# A UE5 build is longer than one 6-hour GitHub job, so it runs as a chain of
# stages: each stage continues where the previous one stopped, and the chain
# ends as soon as the .ipa exists (usually after 2-4 stages).
# Needs the EPIC_GITHUB_TOKEN secret (GitHub token with access to EpicGames/UnrealEngine).
name: iOS Build (UE5, unsigned IPA)

on:
  workflow_dispatch:
    inputs:
      ue_ref:
        description: "Unreal Engine branch or tag (EpicGames/UnrealEngine)"
        type: string
        default: "5.8"
      config:
        description: "Game configuration"
        type: choice
        options: [Development, Shipping]
        default: Development
      runner:
        description: "macOS runner"
        type: choice
        options: [macos-15, macos-26]
        default: macos-15   # macos-26 runners gave disk I/O errors during Setup

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve engine version
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - id: ref
        env:
          TOKEN: ${{ secrets.EPIC_GITHUB_TOKEN }}
          REF: ${{ inputs.ue_ref }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Secret EPIC_GITHUB_TOKEN is missing."; exit 1; fi
          if echo "$REF" | grep -qE '^[0-9a-f]{40}$'; then SHA=$REF; else
            SHA=$(git ls-remote "https://x-access-token:${TOKEN}@github.com/EpicGames/UnrealEngine.git" \
                  "refs/heads/$REF" "refs/tags/$REF^{}" "refs/tags/$REF" | head -1 | cut -f1)
          fi
          if [ -z "$SHA" ]; then echo "::error::Unreal Engine ref '$REF' not found (or no access with EPIC_GITHUB_TOKEN)."; exit 1; fi
          echo "Unreal Engine $REF = $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  s1:
    name: Stage 1
    needs: [prepare]
    uses: ./.github/workflows/ios-stage.yml
    secrets: inherit
    with:
      stage: 1
      prev_state: ''
      ue_sha: ${{ needs.prepare.outputs.sha }}
      runner: ${{ inputs.runner }}
      config: ${{ inputs.config }}

  s2:
    name: Stage 2
    needs: [prepare, s1]
    if: ${{ !cancelled() && needs.s1.result == 'success' && needs.s1.outputs.done != 'true' }}
    uses: ./.github/workflows/ios-stage.yml
    secrets: inherit
    with:
      stage: 2
      prev_state: ios-state-1
      ue_sha: ${{ needs.prepare.outputs.sha }}
      runner: ${{ inputs.runner }}
      config: ${{ inputs.config }}

  s3:
    name: Stage 3
    needs: [prepare, s2]
    if: ${{ !cancelled() && needs.s2.result == 'success' && needs.s2.outputs.done != 'true' }}
    uses: ./.github/workflows/ios-stage.yml
    secrets: inherit
    with:
      stage: 3
      prev_state: ios-state-2
      ue_sha: ${{ needs.prepare.outputs.sha }}
      runner: ${{ inputs.runner }}
      config: ${{ inputs.config }}

  s4:
    name: Stage 4
    needs: [prepare, s3]
    if: ${{ !cancelled() && needs.s3.result == 'success' && needs.s3.outputs.done != 'true' }}
    uses: ./.github/workflows/ios-stage.yml
    secrets: inherit
    with:
      stage: 4
      prev_state: ios-state-3
      ue_sha: ${{ needs.prepare.outputs.sha }}
      runner: ${{ inputs.runner }}
      config: ${{ inputs.config }}

  s5:
    name: Stage 5
    needs: [prepare, s4]
    if: ${{ !cancelled() && needs.s4.result == 'success' && needs.s4.outputs.done != 'true' }}
    uses: ./.github/workflows/ios-stage.yml
    secrets: inherit
    with:
      stage: 5
      prev_state: ios-state-4
      ue_sha: ${{ needs.prepare.outputs.sha }}
      runner: ${{ inputs.runner }}
      config: ${{ inputs.config }}

  s6:
    name: Stage 6
    needs: [prepare, s5]
    if: ${{ !cancelled() && needs.s5.result == 'success' && needs.s5.outputs.done != 'true' }}
    uses: ./.github/workflows/ios-stage.yml
    secrets: inherit
    with:
      stage: 6
      prev_state: ios-state-5
      ue_sha: ${{ needs.prepare.outputs.sha }}
      runner: ${{ inputs.runner }}
      config: ${{ inputs.config }}

  s7:
    name: Stage 7
    needs: [prepare, s6]
    if: ${{ !cancelled() && needs.s6.result == 'success' && needs.s6.outputs.done != 'true' }}
    uses: ./.github/workflows/ios-stage.yml
    secrets: inherit
    with:
      stage: 7
      prev_state: ios-state-6
      ue_sha: ${{ needs.prepare.outputs.sha }}
      runner: ${{ inputs.runner }}
      config: ${{ inputs.config }}

  s8:
    name: Stage 8
    needs: [prepare, s7]
    if: ${{ !cancelled() && needs.s7.result == 'success' && needs.s7.outputs.done != 'true' }}
    uses: ./.github/workflows/ios-stage.yml
    secrets: inherit
    with:
      stage: 8
      prev_state: ios-state-7
      ue_sha: ${{ needs.prepare.outputs.sha }}
      runner: ${{ inputs.runner }}
      config: ${{ inputs.config }}

  result:
    name: Result
    needs: [s1, s2, s3, s4, s5, s6, s7, s8]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          DONE: ${{ needs.s1.outputs.done == 'true' || needs.s2.outputs.done == 'true' || needs.s3.outputs.done == 'true' || needs.s4.outputs.done == 'true' || needs.s5.outputs.done == 'true' || needs.s6.outputs.done == 'true' || needs.s7.outputs.done == 'true' || needs.s8.outputs.done == 'true' }}
        run: |
          if [ "$DONE" = "true" ]; then
            echo "The unsigned .ipa is in this run's artifacts: AurumMobile-iOS-${{ inputs.config }}-unsigned"
          else
            echo "::error::No .ipa was produced. Open the failed stage and the ios-logs-stage-N artifact."
            exit 1
          fi
