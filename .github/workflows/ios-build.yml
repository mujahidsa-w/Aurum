name: iOS Unsigned Build

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: List every file with its size
        run: |
          find . -path ./.git -prune -o -type f -printf "%s\t%p\n" | sort -rn | head -n 200

      - name: Find duplicate file names
        run: |
          find . -path ./.git -prune -o -type f -printf "%f\n" | sort | uniq -d | head -n 100

      - name: Total size of the project
        run: du -sh .
