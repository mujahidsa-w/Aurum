name: iOS Build Preparation

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show project size
        run: |
          du -sh .
          du -sh PUBG_BP_Project/Content

      - name: Show disk space
        run: df -h /

      - name: Clone Unreal Engine 5.4 source
        env:
          GH_TOKEN: ${{ secrets.EPIC_GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch 5.4 https://x-access-token:${GH_TOKEN}@github.com/EpicGames/UnrealEngine.git "$HOME/UnrealEngine"
          du -sh "$HOME/UnrealEngine"

      - name: Setup Unreal Engine dependencies
        run: |
          cd "$HOME/UnrealEngine"
          ./Setup.sh
          ./GenerateProjectFiles.sh

      - name: Build Unreal Engine Editor
        run: |
          cd "$HOME/UnrealEngine"
          ./Engine/Build/BatchFiles/Mac/Build.sh UnrealEditor Mac Development -canskiplink

      - name: Convert project to UE 5.4
        working-directory: ${{ github.workspace }}/PUBG_BP_Project
        run: |
          "$HOME/UnrealEngine/Engine/Binaries/Mac/UnrealEditor.app/Contents/MacOS/UnrealEditor" PUBG_Blueprint.uproject -run=ConvertProject -unattended -nopause || true
