name: iOS Build Preparation

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show project size
        run: |
          du -sh .
          du -sh PUBG_BP_Project/Content

      - name: Show disk space
        run: df -h /

      - name: Select Xcode 26.1.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer
          xcodebuild -version

      - name: Clone Unreal Engine 5.8 source
        env:
          GH_TOKEN: ${{ secrets.EPIC_GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch 5.8 https://x-access-token:${GH_TOKEN}@github.com/EpicGames/UnrealEngine.git "$HOME/UnrealEngine"
          du -sh "$HOME/UnrealEngine"

      - name: Setup Unreal Engine dependencies
        run: |
          cd "$HOME/UnrealEngine"
          ./Setup.sh
          ./GenerateProjectFiles.sh

      - name: Build Unreal Engine Editor
        run: |
          cd "$HOME/UnrealEngine"
          ./Engine/Build/BatchFiles/Mac/Build.sh UnrealEditor Mac Development -canskiplink
