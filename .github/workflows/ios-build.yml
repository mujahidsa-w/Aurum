name: iOS Build Preparation

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show project size
        run: |
          du -sh .
          du -sh PUBG_BP_Project/Content

      - name: Show disk space
        run: df -h /

      - name: Clone Unreal Engine 4.26 source
        env:
          GH_TOKEN: ${{ secrets.EPIC_GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch 4.26 https://x-access-token:${GH_TOKEN}@github.com/EpicGames/UnrealEngine.git "$HOME/UnrealEngine"
          du -sh "$HOME/UnrealEngine"

      - name: Check space after clone
        run: df -h /

      - name: Setup Unreal Engine dependencies
        run: |
          cd "$HOME/UnrealEngine"
          ./Setup.sh
          ./GenerateProjectFiles.sh

      - name: Build Unreal Engine (Mac Editor)
        run: |
          cd "$HOME/UnrealEngine"
          xcodebuild -version
          ./Engine/Build/BatchFiles/Mac/Build.sh UE4Editor Mac Development -canskiplink
