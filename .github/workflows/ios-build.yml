name: iOS Build Preparation

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show project size
        run: |
          echo "Total project size:"
          du -sh .
          echo ""
          echo "Size per top folder:"
          du -sh */ 2>/dev/null | sort -rh
          echo ""
          echo "Content size:"
          du -sh PUBG_BP_Project/Content 2>/dev/null

      - name: Show disk space on the runner
        run: |
          echo "Free disk space on this runner:"
          df -h
        
